[package]
name = "fractal_core"
version = "0.3.2"
edition = "2024"
license = "MIT"
authors = ["Maxe"]
repository = "https://github.com/maxe1025/FractalGenNG"
description = "Pure math/rendering core for FractalGen: fractal kinds, palettes, perturbation-theory deep zoom, and export."

[dependencies]
astro-float = "0.9.5"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rayon = "1.12.0"
ron = "0.12.2"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
