[package]
name = "fractal_app"
version = "0.3.2"
edition = "2024"
license = "MIT"
authors = ["Maxe"]
repository = "https://github.com/maxe1025/FractalGenNG"
description = "GPU-accelerated fractal explorer with deep zoom, animation export, and a Blender-inspired UI."

[lib]
name = "fractal_app"
path = "src/lib.rs"

[[bin]]
name = "fractal_app"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2.32"
bytemuck = { version = "1.25.1", features = ["derive"] }
directories = "6.0.0"
eframe = { version = "0.35.0", features = ["wgpu"] }
egui = "0.35.0"
egui-wgpu = "0.35.0"
env_logger = "0.11.11"
fractal_core = { version = "0.3.2", path = "../fractal_core" }
log = "0.4.33"
pollster = "1.0.1"
rayon = "1.12.0"
rfd = "0.17.2"
ron = "0.12.2"
wgpu = "29.0.4"
